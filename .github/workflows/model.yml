name: CI - Docker

on: ["push"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v3
      - name: Login to DockerHub Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Login to Aliyun Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY_URL }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - name: Push to Registry
        env:
          IMAGE_NAME: archongum/meta-llama:Llama-2-7b-hf
        run: |
          # show size
          du -sh ./*
          # build
          docker build . -f Dockerfile --tag $IMAGE_NAME
          docker tag $IMAGE_NAME ${{ secrets.ALIYUN_REGISTRY_URL }}/$IMAGE_NAME
          # show images
          docker images | head -n 10
          # push
          # docker push $IMAGE_NAME
          docker push ${{ secrets.ALIYUN_REGISTRY_URL }}/$IMAGE_NAME
